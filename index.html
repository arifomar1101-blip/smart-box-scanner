<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>
<meta name="theme-color" content="#4c1d95">

<title>Smart Box QR Scanner</title>

<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  padding:calc(14px + env(safe-area-inset-top)) 12px calc(20px + env(safe-area-inset-bottom));
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:linear-gradient(135deg,#f5f3ff,#ecfeff,#fff7ed);
  color:#111827;
}

.container{
  max-width:650px;
  margin:auto;
}

.hero{
  color:white;
  padding:19px;
  border-radius:24px;
  margin-bottom:13px;
  background:linear-gradient(135deg,#4c1d95,#7c3aed,#db2777,#f97316);
}

.hero.checkin{
  background:linear-gradient(135deg,#1d4ed8,#2563eb,#06b6d4);
}

.hero.arrive{
  background:linear-gradient(135deg,#075985,#0891b2,#10b981);
}

.hero h1{
  margin:5px 0 3px;
  font-size:22px;
}

.hero p{
  margin:0;
  opacity:.87;
  font-size:12px;
}

.metrics{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:12px;
}

.metric{
  background:white;
  padding:11px 5px;
  border-radius:16px;
  text-align:center;
}

.metric strong{
  display:block;
  font-size:22px;
}

.metric span{
  font-size:9px;
  color:#64748b;
}

.card{
  background:white;
  border-radius:21px;
  padding:14px;
  margin-bottom:13px;
  box-shadow:0 8px 22px rgba(15,23,42,.07);
}

.status{
  padding:11px;
  border-radius:14px;
  margin-bottom:11px;
  background:#fef3c7;
  color:#92400e;
  font-size:12px;
}

.status.green{
  background:#dcfce7;
  color:#166534;
}

.status.red{
  background:#fee2e2;
  color:#991b1b;
}

#reader{
  width:100%;
  overflow:hidden;
  border-radius:18px;
}

#reader video{
  width:100% !important;
  border-radius:18px;
}

button{
  width:100%;
  min-height:49px;
  border:0;
  border-radius:14px;
  font-weight:800;
  font-size:15px;
}

.primary{
  margin-top:11px;
  color:white;
  background:linear-gradient(135deg,#6d28d9,#db2777,#f97316);
}

.secondary{
  margin-top:8px;
  background:#f1f5f9;
  color:#334155;
}

.result{
  display:none;
  margin-top:11px;
  padding:13px;
  border-radius:16px;
  text-align:center;
}

.result.show{display:block}
.result.success{background:#dcfce7;color:#166534}
.result.warning{background:#fef3c7;color:#92400e}
.result.error{background:#fee2e2;color:#991b1b}

.result-code{
  font-size:21px;
  font-weight:900;
  margin-top:4px;
}

input,select{
  width:100%;
  min-height:46px;
  border:1px solid #e2e8f0;
  border-radius:13px;
  padding:10px;
  background:white;
  font-size:16px;
}

#cameraSelect{
  display:none;
  margin-bottom:10px;
}

.history{
  display:grid;
  gap:6px;
  margin-top:9px;
}

.history-item{
  display:flex;
  justify-content:space-between;
  gap:8px;
  padding:9px;
  border-radius:12px;
  background:#f8fafc;
  font-size:11px;
}

.history-code{
  font-weight:900;
}
</style>
</head>

<body>

<div class="container">

  <section id="hero" class="hero">
    <div id="modeLabel">🚚 LOADING</div>
    <h1 id="title">Scan Masuk Lori</h1>
    <p id="subtitle"></p>
  </section>

  <section class="metrics">

    <div class="metric">
      <strong id="successCount">0</strong>
      <span>BERJAYA</span>
    </div>

    <div class="metric">
      <strong id="pendingCount">0</strong>
      <span>MENUNGGU</span>
    </div>

    <div class="metric">
      <strong id="errorCount">0</strong>
      <span>RALAT</span>
    </div>

  </section>

  <section class="card">

    <div id="status" class="status">
      📷 Menyediakan kamera QR...
    </div>

    <select id="cameraSelect"></select>

    <div id="reader"></div>

    <button id="startBtn" class="primary" type="button">
      📷 Buka Kamera
    </button>

    <button id="stopBtn" class="secondary" type="button">
      ⏹ Tutup Kamera
    </button>

    <div id="result" class="result">
      <div id="resultMessage"></div>
      <div id="resultCode" class="result-code"></div>
    </div>

  </section>

  <section class="card">

    <strong>Input Manual</strong>

    <p style="font-size:11px;color:#64748b">
      Digunakan jika QR rosak atau sukar dibaca.
    </p>

    <input
      id="manualCode"
      placeholder="BOX-000001"
      autocomplete="off"
      autocapitalize="characters"
    >

    <button id="manualBtn" class="secondary" type="button">
      Hantar Kod
    </button>

  </section>

  <section class="card">

    <strong>Scan Terkini</strong>

    <div id="history" class="history">
      <div class="history-item">
        Belum ada scan.
      </div>
    </div>

  </section>

</div>

<script>
const params =
  new URLSearchParams(
    location.search
  );

const MODE =
  String(
    params.get('mode') ||
    'LOAD'
  ).toUpperCase();

const TRIP_ID =
  String(
    params.get('trip') ||
    ''
  );

const USER =
  String(
    params.get('user') ||
    ''
  );

/*
  Main App menghantar fps=20.
  Minimum 12, maksimum 30.
*/
const FPS =
  Math.max(
    12,
    Math.min(
      30,
      Number(
        params.get('fps') ||
        20
      )
    )
  );

let scanner = null;
let cameras = [];

/*
  RAPID SCAN
  - Kamera tidak menunggu respons Apps Script.
  - Setiap QR dimasukkan ke queue.
  - Queue dihantar satu demi satu supaya rekod kekal tersusun.
  - Kod yang sama ditahan seketika untuk elak frame kamera yang sama.
*/
let scanQueue = [];
let requestMap = {};
let processingQueue = false;
let recentCodes = new Map();
const LOCAL_DUPLICATE_MS = 2500;

let successCount = 0;
let pendingCount = 0;
let errorCount = 0;
let history = [];

/* =====================================================
   MODE
===================================================== */
if(
  MODE === 'CHECKIN' ||
  MODE === 'CHECK-IN'
){

  document.getElementById(
    'hero'
  ).classList.add(
    'checkin'
  );

  document.getElementById(
    'modeLabel'
  ).textContent =
    '📥 CHECK-IN';

  document.getElementById(
    'title'
  ).textContent =
    'Scan Check-In Kotak';

}
else if(
  MODE === 'ARRIVE'
){

  document.getElementById(
    'hero'
  ).classList.add(
    'arrive'
  );

  document.getElementById(
    'modeLabel'
  ).textContent =
    '📍 ARRIVAL';

  document.getElementById(
    'title'
  ).textContent =
    'Scan Sampai Destinasi';

}
else{

  document.getElementById(
    'modeLabel'
  ).textContent =
    '🚚 LOADING';

  document.getElementById(
    'title'
  ).textContent =
    'Scan Masuk Lori';

}

document.getElementById(
  'subtitle'
).textContent =
  TRIP_ID +
  ' • ' +
  USER +
  ' • QR ONLY';

/* =====================================================
   EVENTS
===================================================== */
document.getElementById(
  'startBtn'
).addEventListener(
  'click',
  startCamera
);

document.getElementById(
  'stopBtn'
).addEventListener(
  'click',
  stopCamera
);

document.getElementById(
  'manualBtn'
).addEventListener(
  'click',
  function(){

    processCode(
      document.getElementById(
        'manualCode'
      ).value
    );

  }
);

document.getElementById(
  'manualCode'
).addEventListener(
  'keydown',
  function(e){

    if(
      e.key ===
      'Enter'
    ){

      processCode(
        e.target.value
      );

    }

  }
);

document.getElementById(
  'cameraSelect'
).addEventListener(
  'change',
  function(){

    startSpecificCamera(
      this.value
    );

  }
);

/* =====================================================
   AUTO START
   Safari mungkin perlukan 1 tap.
===================================================== */
window.addEventListener(
  'load',
  function(){

    startCamera();

  }
);

/* =====================================================
   CAMERA
===================================================== */
async function startCamera(){

  const status =
    document.getElementById(
      'status'
    );

  try{

    status.className =
      'status';

    status.textContent =
      '📷 Membuka kamera belakang...';

    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      throw new Error(
        'Browser tidak menyokong kamera.'
      );

    }

    /*
      Permission request.
    */
    const permission =
      await navigator.mediaDevices
        .getUserMedia({

          video:{
            facingMode:{
              ideal:
                'environment'
            }
          },

          audio:false

        });

    permission
      .getTracks()
      .forEach(
        function(track){

          track.stop();

        }
      );

    cameras =
      await Html5Qrcode
        .getCameras();

    if(
      !cameras.length
    ){

      throw new Error(
        'Tiada kamera ditemui.'
      );

    }

    renderCameras();

    let back =
      cameras.find(
        function(cam){

          const name =
            String(
              cam.label ||
              ''
            )
            .toLowerCase();

          return(
            name.includes(
              'back'
            ) ||
            name.includes(
              'rear'
            ) ||
            name.includes(
              'environment'
            )
          );

        }
      );

    if(
      !back
    ){

      back =
        cameras[
          cameras.length - 1
        ];

    }

    document.getElementById(
      'cameraSelect'
    ).value =
      back.id;

    await startSpecificCamera(
      back.id
    );

    status.className =
      'status green';

    status.textContent =
      '🎯 Kamera aktif — imbas QR Code satu demi satu.';

  }
  catch(err){

    console.error(err);

    status.className =
      'status red';

    status.innerHTML =
      '❌ Kamera belum dapat dibuka.<br>' +
      'Tekan <strong>Buka Kamera</strong> untuk cuba semula.';

    document.getElementById(
      'startBtn'
    ).style.display =
      'block';

  }

}

function renderCameras(){

  const select =
    document.getElementById(
      'cameraSelect'
    );

  select.innerHTML =
    '';

  cameras.forEach(
    function(cam,index){

      const option =
        document.createElement(
          'option'
        );

      option.value =
        cam.id;

      option.textContent =
        cam.label ||
        (
          'Kamera ' +
          (index + 1)
        );

      select.appendChild(
        option
      );

    }
  );

  select.style.display =
    cameras.length > 1
      ? 'block'
      : 'none';

}

/* =====================================================
   FAST QR SCAN
===================================================== */
async function startSpecificCamera(
  cameraId
){

  await stopCamera();

  document.getElementById(
    'reader'
  ).innerHTML =
    '';

  scanner =
    new Html5Qrcode(
      'reader'
    );

  /*
    qrbox dibuat besar supaya kamera lebih cepat
    mengunci QR pada kotak.
  */
  await scanner.start(

    cameraId,

    {
      fps:
        FPS,

      /*
        Penting:
        hanya decode QR_CODE.
        Ini kurangkan kerja decoder dan
        mempercepat scan.
      */
      formatsToSupport:[
        Html5QrcodeSupportedFormats.QR_CODE
      ],

      qrbox:
        function(
          width,
          height
        ){

          const size =
            Math.min(
              320,
              Math.floor(
                Math.min(
                  width,
                  height
                ) *
                0.78
              )
            );

          return{
            width:
              size,
            height:
              size
          };

        },

      aspectRatio:
        1.0,

      disableFlip:
        false

    },

    function(decodedText){
      processCode(
        decodedText
      );
    },

    function(){}

  );

  document.getElementById(
    'startBtn'
  ).style.display =
    'none';

}

async function stopCamera(){

  if(scanner){

    try{
      await scanner.stop();
    }
    catch(e){}

    try{
      scanner.clear();
    }
    catch(e){}

    scanner =
      null;

  }

}

/* =====================================================
   PROCESS QR
===================================================== */
function processCode(
  value
){

  const code =
    String(
      value ||
      ''
    )
    .trim()
    .toUpperCase();

  if(!code){
    return;
  }

  /*
    Elak QR yang sama dibaca berulang kali kerana
    ia masih berada di hadapan kamera.
  */
  const now = Date.now();
  const lastSeen =
    recentCodes.get(code) || 0;

  if(
    now - lastSeen <
    LOCAL_DUPLICATE_MS
  ){
    return;
  }

  recentCodes.set(
    code,
    now
  );

  /*
    Bersihkan cache kod lama.
  */
  recentCodes.forEach(
    function(time,key){
      if(
        now - time >
        15000
      ){
        recentCodes.delete(key);
      }
    }
  );

  if(
    !window.opener ||
    window.opener.closed
  ){
    showLocalError(
      code,
      'Scanner mesti dibuka daripada Smart Box Tracker.'
    );
    return;
  }

  const requestId =
    now +
    '-' +
    Math.random()
      .toString(36)
      .slice(2);

  scanQueue.push({
    requestId:
      requestId,
    code:
      code
  });

  pendingCount++;
  updateMetrics();

  /*
    Maklum balas serta-merta.
    Kamera terus boleh membaca QR berikutnya.
  */
  showResult(
    'warning',
    '⏳ DALAM QUEUE',
    code,
    'QR diterima. Sistem sedang menyimpan rekod.'
  );

  beepQueued();

  addHistory(
    code,
    'Menunggu simpanan...',
    true
  );

  processNextQueue();

}

function processNextQueue(){

  if(
    processingQueue ||
    !scanQueue.length
  ){
    return;
  }

  processingQueue =
    true;

  const item =
    scanQueue.shift();

  requestMap[
    item.requestId
  ] = item;

  window.opener.postMessage(
    {
      source:
        'SMART_BOX_SCANNER',
      action:
        'SCAN',
      requestId:
        item.requestId,
      mode:
        MODE,
      tripId:
        TRIP_ID,
      user:
        USER,
      code:
        item.code
    },
    '*'
  );

  /*
    Jika sistem utama tidak menjawab dalam 10 saat,
    lepaskan queue supaya QR lain masih boleh diproses.
  */
  item.timeout =
    setTimeout(
      function(){

        if(
          requestMap[
            item.requestId
          ]
        ){

          delete requestMap[
            item.requestId
          ];

          pendingCount =
            Math.max(
              0,
              pendingCount - 1
            );

          errorCount++;

          updateMetrics();

          showResult(
            'error',
            '❌ TIMEOUT',
            item.code,
            'Tiada respons daripada sistem utama.'
          );

          addHistory(
            item.code,
            'Timeout — tiada respons sistem.',
            false
          );

          beepError();

          processingQueue =
            false;

          processNextQueue();

        }

      },
      10000
    );

}

/* =====================================================
   RESULT FROM MAIN APP
===================================================== */
window.addEventListener(
  'message',
  function(event){

    const data =
      event.data;

    if(
      !data ||
      data.source !==
        'SMART_BOX_TRACKER' ||
      data.action !==
        'SCAN_RESULT'
    ){
      return;
    }

    const item =
      requestMap[
        data.requestId
      ];

    if(!item){
      return;
    }

    clearTimeout(
      item.timeout
    );

    delete requestMap[
      data.requestId
    ];

    pendingCount =
      Math.max(
        0,
        pendingCount - 1
      );

    const result =
      data.result ||
      {};

    const code =
      result.code ||
      item.code ||
      '';

    if(
      result.success
    ){

      successCount++;

      showResult(
        'success',
        '✅ BERJAYA',
        code,
        result.message
      );

      beepSuccess();

      addHistory(
        code,
        result.message,
        true
      );

    }
    else if(
      result.type ===
        'DUPLICATE'
    ){

      /*
        Duplicate server bukan ralat kritikal.
        Ia tidak menambah kiraan BERJAYA.
      */
      showResult(
        'warning',
        '⚠️ SUDAH DISCAN',
        code,
        result.message
      );

      beepWarning();

      addHistory(
        code,
        result.message,
        false
      );

    }
    else{

      errorCount++;

      showResult(
        'error',
        '❌ GAGAL',
        code,
        result.message
      );

      beepError();

      addHistory(
        code,
        result.message,
        false
      );

    }

    updateMetrics();

    processingQueue =
      false;

    /*
      Terus hantar QR seterusnya tanpa delay 650ms.
    */
    processNextQueue();

  }
);

/* =====================================================
   UI RESULT
===================================================== */
function showPending(
  code
){

  const result =
    document.getElementById(
      'result'
    );

  result.className =
    'result show warning';

  document.getElementById(
    'resultMessage'
  ).textContent =
    '⏳ Menyimpan rekod...';

  document.getElementById(
    'resultCode'
  ).textContent =
    code;

}

function showResult(
  type,
  title,
  code,
  message
){

  const result =
    document.getElementById(
      'result'
    );

  result.className =
    'result show ' +
    type;

  document.getElementById(
    'resultMessage'
  ).innerHTML =
    '<strong>' +
    title +
    '</strong><br>' +
    escapeHtml(
      message ||
      ''
    );

  document.getElementById(
    'resultCode'
  ).textContent =
    code;

}

function showLocalError(
  code,
  message
){

  errorCount++;

  showResult(
    'error',
    '❌ GAGAL',
    code,
    message
  );

  updateMetrics();
  beepError();

}

/* =====================================================
   HISTORY
===================================================== */
function addHistory(
  code,
  message,
  ok
){

  history.unshift({
    code:
      code,
    message:
      message,
    ok:
      ok
  });

  history =
    history.slice(
      0,
      10
    );

  renderHistory();

}

function renderHistory(){

  const holder =
    document.getElementById(
      'history'
    );

  holder.innerHTML =
    history.map(
      function(item){

        return `
<div class="history-item">

  <div>

    <div class="history-code">
      ${escapeHtml(item.code)}
    </div>

    <div style="
      margin-top:2px;
      font-size:9px;
      color:#64748b;
    ">
      ${escapeHtml(item.message)}
    </div>

  </div>

  <div>
    ${item.ok ? '✅' : '⚠️'}
  </div>

</div>
        `;

      }
    ).join('');

}

/* =====================================================
   COUNTERS
===================================================== */
function updateMetrics(){

  document.getElementById(
    'successCount'
  ).textContent =
    successCount;

  document.getElementById(
    'pendingCount'
  ).textContent =
    pendingCount;

  document.getElementById(
    'errorCount'
  ).textContent =
    errorCount;

}

/* =====================================================
   SOUND
===================================================== */
function tone(
  frequency,
  duration
){

  try{

    const AudioContextClass =
      window.AudioContext ||
      window.webkitAudioContext;

    if(
      !AudioContextClass
    ){
      return;
    }

    const ctx =
      new AudioContextClass();

    const osc =
      ctx.createOscillator();

    const gain =
      ctx.createGain();

    gain.gain.value =
      .07;

    osc.frequency.value =
      frequency;

    osc.connect(
      gain
    );

    gain.connect(
      ctx.destination
    );

    osc.start();

    setTimeout(
      function(){

        osc.stop();
        ctx.close();

      },
      duration
    );

  }
  catch(e){}

}

function beepQueued(){
  tone(760,45);
  try{
    navigator.vibrate(35);
  }
  catch(e){}
}

function beepSuccess(){

  tone(
    900,
    75
  );

  setTimeout(
    function(){

      tone(
        1200,
        80
      );

    },
    90
  );

  try{
    navigator.vibrate(
      70
    );
  }
  catch(e){}

}

function beepWarning(){
  tone(500,130);
}

function beepError(){
  tone(210,220);
}

function escapeHtml(
  value
){

  const div =
    document.createElement(
      'div'
    );

  div.textContent =
    String(
      value ||
      ''
    );

  return div.innerHTML;

}

</script>

</body>
</html>
